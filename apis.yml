aid: flease
name: Flease
description: 'Flease is a French vehicle-leasing marketplace offering flexible long-term (LLD, 24-50
  month) and medium-term (LMD, 1-12 month) car and utility-vehicle rental to SMEs and small businesses.
  It sources quasi-new vehicles (under two years old, fewer than 30,000 km), delivers within a week
  for LMD and a month for LLD, and bundles a fleet-management web application (webapp.flease.fr) for
  tracking mileage, drivers, maintenance, contracts, and invoices. Flease positions on transparent
  pricing and a roughly 20% lower total cost of ownership versus traditional leasing, with a circular-economy
  angle of redeploying used vehicles. Backed by Partech. No public developer API or documentation is
  published; the customer-facing webapp is a Vue single-page app authenticated with AWS Cognito.'
